# Pushing a tag like v0.1.0 builds lsd for macOS and Linux and publishes the
# binaries as a GitHub release. install.sh downloads them from there.
#
# Release asset names carry no version (lsd-<target>.tar.gz), so
# releases/latest/download/<name> always points at the newest build.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on the Apple silicon runner.
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl links everything in, so one binary runs on any distro.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      # Not every runner image ships rustup, and the ones that do may lag.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # The regex library behind code coloring (Oniguruma) is C, so musl
      # builds need musl-gcc.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run it
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/lsd --version

      - name: Package
        run: |
          name=lsd-${{ matrix.target }}.tar.gz
          cp LICENSE target/${{ matrix.target }}/release/
          tar -czf "$name" -C target/${{ matrix.target }}/release lsd LICENSE
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: lsd-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A draft, so the notes can be written before anyone sees it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "lsd ${GITHUB_REF_NAME#v}" \
            --notes "Binaries for $GITHUB_REF_NAME."
