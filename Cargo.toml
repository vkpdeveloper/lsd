[package]
name = "lsd"
version = "0.1.0"
edition = "2024"
description = "ls + display: Finder-style listing and browsing with real thumbnails, drawn with the kitty graphics protocol"
license = "MIT"
repository = "https://github.com/vkpdeveloper/lsd"
publish = false

[[bin]]
name = "lsd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
libc = "0.2"
ratatui = "0.30"
serde_json = { version = "1", features = ["preserve_order"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
