[package]
name = "lsd"
version = "0.1.6"
edition = "2024"
description = "ls + display: lists files with real thumbnails, like a Finder window in your terminal, plus a vim-key browser with a preview pane and Quick Look"
license = "MIT"
repository = "https://github.com/vkpdeveloper/lsd"
publish = false

[[bin]]
name = "lsd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
libc = "0.2"
ratatui = "0.30"
serde_json = { version = "1", features = ["preserve_order"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The freedesktop thumbnail cache names files by the MD5 of their URI.
[target.'cfg(not(target_os = "macos"))'.dependencies]
md5 = "0.8"

[dev-dependencies]
md5 = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
